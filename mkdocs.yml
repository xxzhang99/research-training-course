site_name: WHU CS 科研训练
site_description: 武汉大学计算机科研训练课程公开网站
site_author: 课程教学团队
site_url: https://xxzhang99.github.io/research-training-course/
repo_url: https://github.com/xxzhang99/research-training-course
repo_name: 课程源码
edit_uri: edit/main/docs/

copyright: WHU CS 科研训练 · 课程资料仅用于教学与学习

not_in_nav: |
  lectures/**
  projects/**
  resources/**
  policies/**
  showcase/**
  archive/**
  syllabus.md

nav:
  - 首页: index.md
  - 课程日历: schedule.md
  - 课程作业: assignments/index.md
  - FAQ: faq.md

theme:
  name: material
  language: zh
  logo: assets/images/whu-mark.svg
  favicon: assets/images/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    scheme: default
    primary: custom
    accent: custom
  font: false

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/css/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xxzhang99/research-training-course
      name: GitHub仓库
